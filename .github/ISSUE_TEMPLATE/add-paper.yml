name: Add a paper
description: Propose a robotic reward model, benchmark, or dataset for the list.
title: "[Add] "
labels: [literature]
body:
  - type: input
    id: title
    attributes:
      label: Paper title
    validations:
      required: true
  - type: input
    id: paper
    attributes:
      label: Paper URL
    validations:
      required: true
  - type: dropdown
    id: family
    attributes:
      label: Section
      options:
        - Outcome
        - Absolute Progress
        - Relative
        - Temporal Value
        - Hybrid
        - Benchmark
        - Data
        - Not sure
    validations:
      required: true
  - type: input
    id: output
    attributes:
      label: Native output
      description: What the model returns before any downstream transformation, in a few words.
  - type: input
    id: links
    attributes:
      label: Code, weights, or data links
