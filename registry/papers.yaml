  - title: "Failure-Aware RL: Reliable Offline-to-Online Reinforcement Learning"
    source: "https://arxiv.org/abs/2601.07821"
    decision: "exclude_core"
    reason: "Failure-aware RL paradigm without a separately characterized reward/evaluator model."
    verification_date: "2026-07-18"
  - title: "Recover, Discover, Plan: Learning Skills and Concepts from Robot Failures"
    source: "https://arxiv.org/abs/2606.18328"
    decision: "adjacent_only"
    reason: "Central contribution is failure-driven skill/concept learning and planning, not reward-model evaluation."
