schema_version: "0.2"
registry_name: "Awesome Robot Reward Models"
last_updated: "2026-09-28"
baseline_source: "robotic_reward_pami_handover_2026-07-18.md"
scope_note: >-
  Primary narrative categories follow reward semantics. Failure/recovery work is
  included only as evaluator supervision, benchmark data, or explicitly tagged
  adjacent context. Policy/world-model coupling is an optional cross-cutting
  architecture axis and never replaces primary reward semantics. Artifact
  availability and licenses are recorded separately.

