    evidence_note: "Thea's Evaluation as Exit Codes module independently maps current visual evidence and an explicit post-condition to in-progress, success, or failure, then gates termination, retry, recovery, and world-state updates. The authors report 93.3% average accuracy on 90 balanced real-robot checkpoints; the small test, lack of a confidence/unknown output, and harmful false-success errors make evidence calibration a central benchmark requirement."
    sources: ["https://arxiv.org/abs/2608.11246", "https://eit-hai.github.io/thea/", "https://github.com/EIT-HAI/Thea"]

